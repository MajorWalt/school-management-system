<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="text-center px-4">
        <!-- Error Code -->
        <div class="mb-8">
            <h1 class="text-9xl font-bold text-indigo-600">404</h1>
        </div>
        
        <!-- Error Message -->
        <div class="mb-8">
            <h2 class="text-4xl font-bold text-gray-800 mb-4">Page Not Found</h2>
            <p class="text-xl text-gray-600 mb-2">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <p class="text-gray-500">
                Error Code: {{ status_code }}
            </p>
        </div>
        
        <!-- Back to Home Button -->
        <div class="flex gap-4 justify-center">
            <a href="/" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg transition">
                Back to Home
            </a>
            <a href="/dashboard/" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-lg transition">
                Go to Dashboard
            </a>
        </div>
        
        <!-- Illustration -->
        <div class="mt-12 opacity-50">
            <svg class="mx-auto w-48 h-48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
    </div>
</body>
</html>
