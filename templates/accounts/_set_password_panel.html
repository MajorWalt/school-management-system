{# Usage: {% include "accounts/_set_password_panel.html" with target_user=<user object> %} #}
<div id="pw-panel-{{ target_user.pk }}" class="pw-panel">
  <div class="flex items-center justify-between gap-3">
    <div>
      <span class="text-gray-400 block text-xs">Password</span>
      <p class="font-medium tracking-widest text-gray-900">••••••••</p>
    </div>
    <button type="button" data-pw-action="toggle"
      class="px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-300 text-gray-600 hover:bg-gray-50 transition">Set password</button>
  </div>

  <form method="post" action="{% url 'accounts:user_set_password' target_user.pk %}" data-pw-form
    class="mt-4 space-y-3 rounded-lg border border-gray-200 bg-gray-50 p-4" style="display:none;">
    {% csrf_token %}
    <div>
      <label for="pw1-{{ target_user.pk }}" class="block text-xs text-gray-500 mb-1">New password</label>
      <div class="flex gap-2">
        <input id="pw1-{{ target_user.pk }}" name="new_password1" type="password" required autocomplete="new-password" data-pw-input="1"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <button type="button" data-pw-action="show"
          class="px-3 rounded-lg text-sm border border-gray-300 text-gray-600 hover:bg-white">Show</button>
      </div>
    </div>
    <div>
      <label for="pw2-{{ target_user.pk }}" class="block text-xs text-gray-500 mb-1">Confirm password</label>
      <input id="pw2-{{ target_user.pk }}" name="new_password2" type="password" required autocomplete="new-password" data-pw-input="2"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      <p data-pw-mismatch class="mt-1 text-xs text-red-600" style="display:none;">Passwords don't match.</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button type="button" data-pw-action="generate"
        class="px-3 py-1.5 rounded-lg text-sm border border-gray-300 text-gray-600 hover:bg-white">Generate</button>
      <button type="button" data-pw-action="copy"
        class="px-3 py-1.5 rounded-lg text-sm border border-gray-300 text-gray-600 hover:bg-white">Copy</button>
      <span class="flex-1"></span>
      <button type="button" data-pw-action="cancel"
        class="px-3 py-1.5 rounded-lg text-sm text-gray-600 hover:bg-gray-100">Cancel</button>
      <button type="submit" data-pw-submit disabled
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed">Save password</button>
    </div>
    <p class="text-xs text-gray-400">Copy the password before saving. It can't be shown again afterwards.</p>
  </form>
</div>

<script>
  (function () {
    var panel = document.getElementById('pw-panel-{{ target_user.pk }}');
    if (!panel) { return; }
    var form = panel.querySelector('[data-pw-form]');
    var pw1 = panel.querySelector('[data-pw-input="1"]');
    var pw2 = panel.querySelector('[data-pw-input="2"]');
    var mismatch = panel.querySelector('[data-pw-mismatch]');
    var submit = panel.querySelector('[data-pw-submit]');
    var toggleBtn = panel.querySelector('[data-pw-action="toggle"]');
    var showBtn = panel.querySelector('[data-pw-action="show"]');
    var copyBtn = panel.querySelector('[data-pw-action="copy"]');
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*?';

    function validate() {
      var differs = pw2.value !== '' && pw1.value !== pw2.value;
      mismatch.style.display = differs ? 'block' : 'none';
      submit.disabled = pw1.value === '' || pw1.value !== pw2.value;
    }

    function setVisible(visible) {
      pw1.type = visible ? 'text' : 'password';
      pw2.type = visible ? 'text' : 'password';
      showBtn.textContent = visible ? 'Hide' : 'Show';
    }

    function setOpen(open) {
      form.style.display = open ? 'block' : 'none';
      toggleBtn.textContent = open ? 'Close' : 'Set password';
      if (!open) {
        pw1.value = '';
        pw2.value = '';
        setVisible(false);
        validate();
      }
    }

    panel.addEventListener('click', function (event) {
      var button = event.target.closest('[data-pw-action]');
      if (!button) { return; }
      var action = button.getAttribute('data-pw-action');

      if (action === 'toggle') {
        setOpen(form.style.display === 'none');
      } else if (action === 'cancel') {
        setOpen(false);
      } else if (action === 'show') {
        setVisible(pw1.type === 'password');
      } else if (action === 'generate') {
        var values = new Uint32Array(12);
        window.crypto.getRandomValues(values);
        var generated = '';
        for (var i = 0; i < values.length; i++) {
          generated += chars[values[i] % chars.length];
        }
        pw1.value = generated;
        pw2.value = generated;
        setVisible(true);
        validate();
      } else if (action === 'copy') {
        if (!pw1.value) { return; }
        var done = function () {
          copyBtn.textContent = 'Copied';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(pw1.value).then(done);
        } else {
          pw1.type = 'text';
          pw1.select();
          document.execCommand('copy');
          done();
        }
      }
    });

    pw1.addEventListener('input', validate);
    pw2.addEventListener('input', validate);
  })();
</script>
