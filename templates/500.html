<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-red-50 to-orange-100 min-h-screen flex items-center justify-center">
    <div class="text-center px-4">
        <!-- Error Code -->
        <div class="mb-8">
            <h1 class="text-9xl font-bold text-red-600">500</h1>
        </div>
        
        <!-- Error Message -->
        <div class="mb-8">
            <h2 class="text-4xl font-bold text-gray-800 mb-4">Server Error</h2>
            <p class="text-xl text-gray-600 mb-2">
                Something went wrong on our end.
            </p>
            <p class="text-gray-500">
                Our team has been notified and is working to fix it.
            </p>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex gap-4 justify-center">
            <a href="/" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg transition">
                Back to Home
            </a>
            <a href="/accounts/login/" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-lg transition">
                Go to Login
            </a>
        </div>
        
        <!-- Illustration -->
        <div class="mt-12 opacity-50">
            <svg class="mx-auto w-48 h-48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
    </div>
</body>
</html>
